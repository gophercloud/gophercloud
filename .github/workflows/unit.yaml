name: Unit Testing
on:
  - merge_group
  - push
  - pull_request
permissions:
  contents: read
jobs:
  test:
    permissions:
      checks: write  # for coverallsapp/github-action to create a new check based on the results
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Gophercloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.4
          cache: true
      - name: Setup environment
        run: |
          # Changing into a different directory to avoid polluting go.sum with "go get"
          cd "$(mktemp -d)"
          go mod init unit_tests
          go install github.com/alexfalkowski/gocovmerge@v1.4.0
      - name: Run containerinfra unit tests
        run: |
          go test -v -run TestCreateCertificates -count 10 ./openstack/containerinfra/v1/certificates/testing
          go run gotest.tools/gotestsum@v1.13.0 --format testname -- -v -shuffle on -run TestCreateCertificates -count 10 ./openstack/containerinfra/v1/certificates/testing
      - name: Run unit tests
        run: |
          make unit
          make coverage
      - name: Check coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: cover.out
          parallel: true
  finish:
    permissions:
      checks: write  # for coverallsapp/github-action to create a new check based on the results
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Store coverage results
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        parallel-finished: true
