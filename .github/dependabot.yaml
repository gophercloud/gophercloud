version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  ignore:
    # Below dependencies need a newer go version (>= 1.26):
    - dependency-name: "golang.org/x/crypto"
      update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  groups:
    all-go-mod:
      patterns: [ "*" ]
- package-ecosystem: "github-actions"
  directory: "/"
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    all-github-actions:
      patterns: [ "*" ]
- package-ecosystem: gomod
